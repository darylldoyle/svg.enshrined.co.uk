<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
    <title>CSS payloads</title>

    <style type="text/css">
        @import url("https://example.com/remote.css");

        .panel {
            fill: #1e293b;
            background-image: url("https://example.com/tracker.png");
        }

        .legacy {
            width: expression(alert('css expression'));
            behavior: url(evil.htc);
            -moz-binding: url("https://example.com/xbl.xml#exec");
        }

        .fine {
            fill: #38bdf8;
            stroke-width: 2;
        }
    </style>

    <rect class="panel" width="320" height="200"/>
    <circle class="fine" cx="160" cy="100" r="60"/>
    <rect class="legacy" x="20" y="20" width="40" height="40"
          style="fill: url('https://example.com/pattern.svg'); stroke: #fff"/>
</svg>
